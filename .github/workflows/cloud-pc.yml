name: Cloud PC

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: "Identificador da Cloud PC (ex.: CloudPC-003)"
        required: true
        type: string
      session_id:
        description: "Identificador da sessão"
        required: true
        type: string
      game_id:
        description: "Jogo simulado"
        required: true
        type: string
      duration:
        description: "Duração da sessão em segundos"
        required: true
        default: "300"
        type: string

concurrency:
  group: cloud-pc-${{ inputs.machine_id }}
  cancel-in-progress: false

jobs:
  cloud-pc:
    name: ${{ inputs.machine_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Inicializar ambiente
        id: init
        run: |
          echo "MACHINE=${{ inputs.machine_id }}" >> "$GITHUB_ENV"
          echo "SESSION=${{ inputs.session_id }}" >> "$GITHUB_ENV"
          echo "Cloud PC ${{ inputs.machine_id }} iniciando (job ${{ github.run_id }})"

      - name: Registrar STARTING
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -H "x-cloudpc-secret: $CALLBACK_SECRET" \
            -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"STARTING\",\"message\":\"$MACHINE está iniciando...\",\"run_id\":\"${{ github.run_id }}\",\"job_id\":\"${{ github.job }}-${{ github.run_number }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"job_status\":\"RUNNING\"}"
        env:
          CALLBACK_URL: ${{ secrets.CLOUD_PC_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CLOUD_PC_CALLBACK_SECRET }}

      - name: Registrar BOOTING_WINDOWS
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -H "x-cloudpc-secret: $CALLBACK_SECRET" \
            -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"BOOTING_WINDOWS\",\"message\":\"Inicializando Windows 10...\"}"
          sleep 6
        env:
          CALLBACK_URL: ${{ secrets.CLOUD_PC_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CLOUD_PC_CALLBACK_SECRET }}

      - name: Registrar READY
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -H "x-cloudpc-secret: $CALLBACK_SECRET" \
            -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"READY\",\"message\":\"Windows 10 carregado. Máquina pronta.\"}"
        env:
          CALLBACK_URL: ${{ secrets.CLOUD_PC_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CLOUD_PC_CALLBACK_SECRET }}

      - name: Executar sessão simulada e enviar métricas
        run: |
          DURATION="${{ inputs.duration }}"
          ELAPSED=0
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -H "x-cloudpc-secret: $CALLBACK_SECRET" \
            -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"GAMING\",\"message\":\"Executando ${{ inputs.game_id }}\"}"
          while [ "$ELAPSED" -lt "$DURATION" ]; do
            FPS=$((55 + RANDOM % 15))
            CPU=$((30 + RANDOM % 50))
            GPU=$((45 + RANDOM % 50))
            RAM=$((35 + RANDOM % 40))
            PING=$((18 + RANDOM % 40))
            curl -sS -X POST "$CALLBACK_URL" \
              -H "content-type: application/json" \
              -H "x-cloudpc-secret: $CALLBACK_SECRET" \
              -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"GAMING\",\"message\":\"Sessão em andamento\",\"metrics\":{\"fps\":$FPS,\"cpu\":$CPU,\"gpu\":$GPU,\"ram\":$RAM,\"ping\":$PING}}"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
        env:
          CALLBACK_URL: ${{ secrets.CLOUD_PC_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CLOUD_PC_CALLBACK_SECRET }}

      - name: Encerrar sessão (STOPPING)
        if: always()
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -H "x-cloudpc-secret: $CALLBACK_SECRET" \
            -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"STOPPING\",\"message\":\"Encerrando sessão...\"}"
        env:
          CALLBACK_URL: ${{ secrets.CLOUD_PC_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CLOUD_PC_CALLBACK_SECRET }}

      - name: Liberar máquina (AVAILABLE)
        if: always()
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -H "x-cloudpc-secret: $CALLBACK_SECRET" \
            -d "{\"machine_name\":\"$MACHINE\",\"session_id\":\"$SESSION\",\"status\":\"AVAILABLE\",\"message\":\"Máquina liberada.\",\"job_status\":\"COMPLETED\"}"
        env:
          CALLBACK_URL: ${{ secrets.CLOUD_PC_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CLOUD_PC_CALLBACK_SECRET }}
