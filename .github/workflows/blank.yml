name: Windows RDP - Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configurar RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser -Name "Edson" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "Edson" `
              -Password $password `
              -PasswordNeverExpires
          } else {
            Set-LocalUser `
              -Name "Edson" `
              -Password $password
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Edson" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP configurado."

      - name: Instalar Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$env:TEMP\tailscale.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /qn /norestart" `
            -Wait

      - name: Conectar ao Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="github-rdp-edson"

          Write-Host "IP Tailscale:"
          & $ts ip -4

      - name: Manter runner ativo
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "RDP ONLINE"
          Write-Host "Usuario: Edson"
          Write-Host "================================"

          Start-Sleep -Seconds 21600
