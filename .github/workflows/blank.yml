name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Instalar e Configurar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --silent" -Wait
        
        Write-Host "Configurando Acesso Não Supervisionado..."
        # Forçamos a senha usando cmd para garantir o pipe correto
        cmd.exe /c "echo SuaSenhaForte123! | `"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --set-password"
        
        Write-Host "Reiniciando serviço..."
        Restart-Service -Name "AnyDesk" -Force
        Start-Sleep -Seconds 10
        
        $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
        $id = & $anydesk --get-id
        Write-Host "----------------------------------------------"
        Write-Host "ID do AnyDesk: $id"
        Write-Host "----------------------------------------------"

    - name: Configurar Acesso Remoto (RDP)
      shell: powershell
      run: |
        $password = ConvertTo-SecureString "SuaSenhaForte123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Mostrar Dados de Acesso
      shell: powershell
      run: |
        Write-Host "IP do Tailscale: $(tailscale ip -4)"
        Write-Host "Se o ID do AnyDesk aparecer acima, use-o com a senha: SuaSenhaForte123!"
        Write-Host "Se não, use o IP do Tailscale via RDP (RD Client)."

    - name: Manter Runner Ativo
      shell: powershell
      run: |
        Start-Sleep -Seconds 21600
