name: RDP Teste

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Diagnosticar Windows
        shell: powershell
        run: |
          Write-Host "Windows:"
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

          Write-Host ""
          Write-Host "Usuario atual:"
          whoami

          Write-Host ""
          Write-Host "Testando PowerShell:"
          $PSVersionTable.PSVersion

      - name: Criar usuario Edson
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          try {
              $ErrorActionPreference = "Stop"

              Write-Host "Verificando usuario..."

              $user = Get-LocalUser -Name "Edson" -ErrorAction SilentlyContinue

              if ($null -eq $user) {
                  Write-Host "Criando Edson..."
                  $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
                  New-LocalUser -Name "Edson" -Password $pass
              } else {
                  Write-Host "Edson ja existe."
              }

              Write-Host "OK"
          }
          catch {
              Write-Host "ERRO:"
              Write-Host $_
              exit 0
          }

      - name: Testar RDP
        shell: powershell
        run: |
          Write-Host "Habilitando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Write-Host "Configuracao concluida."

      - name: Final
        shell: powershell
        run: |
          Write-Host "TESTE TERMINADO"
          Start-Sleep -Seconds 60
