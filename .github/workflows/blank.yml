name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Otimizar Memoria Virtual (Pagefile) e Desempenho
      shell: powershell
      run: |
        Write-Host "Configurando Pagefile e Efeitos Visuais..."
        
        # Ajusta efeitos visuais para melhor desempenho sem quebrar o powercfg
        $VisualKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
        if (-not (Test-Path $VisualKey)) { New-Item -Path $VisualKey -Force }
        Set-ItemProperty -Path $VisualKey -Name "VisualFXSetting" -Value 2

    - name: Instalar e Configurar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando AnyDesk..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --silent" -Wait
        
        Write-Host "Configurando Acesso Nao Supervisionado..."
        cmd.exe /c "echo SuaSenhaForte123! | `"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --set-password"
        
        Restart-Service -Name "AnyDesk" -Force
        Start-Sleep -Seconds 10

    - name: Instalar Driver de Monitor Virtual (VDD)
      shell: powershell
      run: |
        Write-Host "Baixando Virtual Display Driver..."
        $vddUrl = "https://github.com/itsmikethetech/Virtual-Display-Driver/releases/latest/download/Virtual-Display-Driver.zip"
        $zipPath = "$env:TEMP\VDD.zip"
        $extractPath = "C:\VDD"

        Invoke-WebRequest -Uri $vddUrl -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

        Write-Host "Instalando certificado do driver..."
        $certPath = Get-ChildItem -Path $extractPath -Filter "*.cer" -Recurse | Select-Object -First 1
        if ($certPath) {
            Import-Certificate -FilePath $certPath.FullName -CertStoreLocation Cert:\LocalMachine\TrustedPublisher
            Import-Certificate -FilePath $certPath.FullName -CertStoreLocation Cert:\LocalMachine\Root
        }

        Write-Host "Instalando o dispositivo de video virtual..."
        $infPath = Get-ChildItem -Path $extractPath -Filter "*.inf" -Recurse | Select-Object -First 1
        if ($infPath) {
            pnputil /add-driver $infPath.FullName /install
        }

    - name: Instalar Aplicativos (Discord e Steam)
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'

        Write-Host "Instalando Discord..."
        winget install --id Discord.Discord --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Steam..."
        winget install --id Valve.Steam --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalacoes de apps concluidas!"

    - name: Baixar e Instalar MTA:SA
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'
        
        Write-Host "Baixando o instalador do MTA:SA..."
        $mtaInstaller = "$env:TEMP\mta_installer.exe"
        Invoke-WebRequest -Uri "https://nightly.multitheftauto.com/mtasa-1.6-full_latest.exe" -OutFile $mtaInstaller

        Write-Host "Instalando MTA:SA..."
        Start-Process -FilePath $mtaInstaller -ArgumentList "/S" -Wait

        Write-Host "MTA:SA instalado com sucesso!"

    - name: Configurar Autologin e Desativar Tela de Bloqueio
      shell: powershell
      run: |
        $passwordText = "SuaSenhaForte123!"
        $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

        $logonPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
        Set-ItemProperty -Path $logonPath -Name "AutoAdminLogon" -Value "1"
        Set-ItemProperty -Path $logonPath -Name "DefaultUserName" -Value "runneradmin"
        Set-ItemProperty -Path $logonPath -Name "DefaultPassword" -Value $passwordText
        Set-ItemProperty -Path $logonPath -Name "DisableCAD" -Value 1

        $desktopKey = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop"
        if (-not (Test-Path $desktopKey)) { New-Item -Path $desktopKey -Force }
        Set-ItemProperty -Path $desktopKey -Name "ScreenSaveActive" -Value "0"

    - name: Configurar Papel de Parede
      shell: powershell
      run: |
        $imgPath = "C:\Windows\Web\Wallpaper\Windows\img0.jpg"
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $imgPath
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10"
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value "0"
        
        Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class W { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
        [W]::SystemParametersInfo(0x0014, 0, $imgPath, 0x01 -bor 0x02)

    - name: Manter Runner Ativo
      shell: powershell
      run: |
        Write-Host "Tudo pronto! O Windows esta liberado no modo de Desempenho Maximo."
        Start-Sleep -Seconds 21600
