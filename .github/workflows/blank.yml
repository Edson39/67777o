name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configurar usuário RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "Edson" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "Edson" -Password $password -PasswordNeverExpires
          } else {
              Set-LocalUser -Name "Edson" -Password $password
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Edson"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Instalar Tailscale
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Conectar ao Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="github-rdp-edson"

      - name: Mostrar IP do Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

      - name: Manter runner ativo
        shell: powershell
        run: |
          Write-Host "RDP ativo."
          Write-Host "Usuário: Edson"
          Write-Host "Conecte usando o IP Tailscale mostrado acima."
          Start-Sleep -Seconds 21600
