name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Criar usuário RDP
        shell: powershell
        run: |
          # ===== CONFIGURAÇÃO =====
          $username = "Edson"
          $passwordPlain = "SuaSenhaForte123"
          # ========================

          $password = ConvertTo-SecureString $passwordPlain -AsPlainText -Force

          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              New-LocalUser `
                -Name $username `
                -Password $password `
                -PasswordNeverExpires `
                -Description "Usuário RDP"
          } else {
              Set-LocalUser -Name $username -Password $password
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Mostrar IP Tailscale
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          Write-Host "===== DADOS DO RDP ====="
          Write-Host "Usuário: Edson"
          Write-Host "IP Tailscale:"
          tailscale ip -4
          Write-Host "========================"

      - name: Manter runner ativo
        shell: powershell
        run: |
          Write-Host "RDP pronto."
          Start-Sleep -Seconds 21600
