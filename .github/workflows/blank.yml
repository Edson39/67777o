name: RDP Windows + Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configurar usuário
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $pass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "Edson" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              New-LocalUser `
                -Name "Edson" `
                -Password $pass `
                -PasswordNeverExpires
          } else {
              Set-LocalUser `
                -Name "Edson" `
                -Password $pass
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Edson" `
            -ErrorAction SilentlyContinue

          Write-Host "Usuario configurado."

      - name: Habilitar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP habilitado."

      - name: Instalar Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $file

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$file`" /qn /norestart" `
            -Wait

          Write-Host "Tailscale instalado."

      - name: Conectar Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="github-rdp-edson"

          Start-Sleep -Seconds 5

          Write-Host "================================"
          Write-Host "IP TAILSCALE:"
          & $ts ip -4
          Write-Host "================================"

      - name: Verificar RDP
        shell: powershell
        run: |
          Write-Host "Porta RDP:"
          Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP ONLINE"

      - name: Manter runner ativo
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "WINDOWS RDP ONLINE"
          Write-Host "Usuario: Edson"
          Write-Host "Tempo maximo: 6 horas"
          Write-Host "================================"

          Start-Sleep -Seconds 21600
