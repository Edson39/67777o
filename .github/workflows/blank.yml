name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Instalar e Configurar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando AnyDesk..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --silent" -Wait
        
        Write-Host "Configurando Acesso Nao Supervisionado..."
        cmd.exe /c "echo SuaSenhaForte123! | `"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --set-password"
        
        Restart-Service -Name "AnyDesk" -Force
        Start-Sleep -Seconds 10

    - name: Instalar e Configurar Sunshine
      shell: powershell
      run: |
        Write-Host "Instalando Sunshine..."
        winget install --id LizardByte.Sunshine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity

        $sunshinePath = "C:\Program Files\LizardByte\Sunshine\sunshine.exe"
        
        $timeout = 0
        while (-not (Test-Path $sunshinePath) -and $timeout -lt 30) {
            Start-Sleep -Seconds 2
            $timeout += 2
        }

        $configPath = "C:\Program Files\LizardByte\Sunshine\config"
        $appDataPath = "$env:LOCALAPPDATA\sunshine"
        if (-not (Test-Path $configPath)) { New-Item -ItemType Directory -Path $configPath -Force }
        if (-not (Test-Path $appDataPath)) { New-Item -ItemType Directory -Path $appDataPath -Force }

        Write-Host "Configurando credenciais..."
        if (Test-Path $sunshinePath) {
            & "$sunshinePath" --creds admin 12345678
        } else {
            Write-Host "Aviso: Executavel do Sunshine nao encontrado no caminho padrao."
        }

        Write-Host "Liberando Firewall..."
        New-NetFirewallRule -DisplayName "Sunshine-TCP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Sunshine-UDP" -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -ErrorAction SilentlyContinue

    - name: Instalar Jogos e Aplicativos
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'

        Write-Host "Instalando Discord..."
        winget install --id Discord.Discord --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Steam..."
        winget install --id Valve.Steam --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Roblox Player..."
        winget install --id Roblox.Roblox --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Bloxstrap..."
        winget install --id pizzaboxer.Bloxstrap --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalacoes concluidas!"

    - name: Configurar Autologin e Desativar Tela de Bloqueio
      shell: powershell
      run: |
        $passwordText = "SuaSenhaForte123!"
        $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password

        # Ativa RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

        # Configura Autologin sem Ctrl+Alt+Del
        $logonPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
        Set-ItemProperty -Path $logonPath -Name "AutoAdminLogon" -Value "1"
        Set-ItemProperty -Path $logonPath -Name "DefaultUserName" -Value "runneradmin"
        Set-ItemProperty -Path $logonPath -Name "DefaultPassword" -Value $passwordText
        Set-ItemProperty -Path $logonPath -Name "DisableCAD" -Value 1

        # Cria a chave do registro caso ela nao exista antes de definir o valor
        $desktopKey = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop"
        if (-not (Test-Path $desktopKey)) {
            New-Item -Path $desktopKey -Force
        }
        Set-ItemProperty -Path $desktopKey -Name "ScreenSaveActive" -Value "0"

        $powerKey = "HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51"
        if (-not (Test-Path $powerKey)) {
            New-Item -Path $powerKey -Force
        }
        Set-ItemProperty -Path $powerKey -Name "ACSettingIndex" -Value 0

        # Agenda o Sunshine para rodar na sessao do usuario
        schtasks /create /tn "SunshineStartup" /tr "C:\Program Files\LizardByte\Sunshine\sunshine.exe" /sc onlogon /ru runneradmin /f

    - name: Configurar Papel de Parede
      shell: powershell
      run: |
        $imgPath = (Get-Item ".\e54ff1cc376b23c96a3d27edaadbc1fc.jpg").FullName
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $imgPath
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10"
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value "0"
        
        Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class W { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
        [W]::SystemParametersInfo(0x0014, 0, $imgPath, 0x01 -bor 0x02)

    - name: Iniciar Sunshine e Manter Runner Ativo
      shell: powershell
      run: |
        Write-Host "Iniciando Sunshine no Desktop..."
        Start-Process -FilePath "C:\Program Files\LizardByte\Sunshine\sunshine.exe" -WindowStyle Hidden
        Write-Host "Tudo pronto! O Windows esta liberado para acesso direto pelo Moonlight."
        Start-Sleep -Seconds 21600
