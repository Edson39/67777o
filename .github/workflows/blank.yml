name: RDP + Tailscale Diagnostico

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "Edson" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser "Edson" -Password $pass
          } else {
            Set-LocalUser "Edson" -Password $pass
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Edson" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP OK"

      - name: Baixar Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $out = "$env:TEMP\tailscale.msi"

          Write-Host "Baixando Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $out

          Write-Host "Download OK"
          Write-Host "Arquivo: $out"

      - name: Instalar Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $file = "$env:TEMP\tailscale.msi"

          Write-Host "Instalando..."

          $process = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$file`" /qn /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "Instalacao do Tailscale falhou."
          }

      - name: Verificar Tailscale
        shell: powershell
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Procurando:"
          Write-Host $ts

          if (!(Test-Path $ts)) {
            throw "tailscale.exe nao foi encontrado."
          }

          & $ts version

      - name: Conectar Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "O Secret TS_AUTHKEY esta vazio ou nao existe."
          }

          & $ts up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="github-rdp-edson"

          Start-Sleep -Seconds 5

          Write-Host "IP Tailscale:"
          & $ts ip -4

      - name: Final
        shell: powershell
        run: |
          Write-Host "RDP + Tailscale terminou."
          Start-Sleep -Seconds 60
