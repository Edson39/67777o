name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Instalar e Configurar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando o serviço do AnyDesk..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --silent --create-desktop-icon" -Wait
        
        Start-Sleep -Seconds 3
        
        Write-Host "Configurando senha de acesso não supervisionado..."
        $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
        
        # Define a senha para acesso remoto direto
        "SuaSenhaForte123!" | & $anydesk --set-password
        
        # Reinicia o serviço para aplicar a senha
        Restart-Service -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
        
        # Pega e exibe o ID nativo do AnyDesk nos logs por garantia
        Write-Host "----------------------------------------------"
        $anydeskId = & $anydesk --get-id
        Write-Host "ID do AnyDesk: $anydeskId"
        Write-Host "----------------------------------------------"

    - name: Configurar Senha do Windows e RDP
      shell: powershell
      run: |
        $password = ConvertTo-SecureString "SuaSenhaForte123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Mostrar IP do Tailscale
      shell: powershell
      run: |
        Write-Host "IP do Tailscale para conexão RDP ou AnyDesk:"
        tailscale ip -4

    - name: Manter Runner Ativo
      shell: powershell
      run: |
        Write-Host "Máquina online! Conecte via AnyDesk ou RDP usando o IP ou ID acima."
        Start-Sleep -Seconds 21600
