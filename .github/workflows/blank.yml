name: Test Cloud GPU PC

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f colab/cloud_gpu_pc.py
          test -f scripts/setup_desktop.sh
          test -f requirements.txt

      - name: Test Python
        run: |
          python -m py_compile colab/cloud_gpu_pc.py

      - name: Test shell
        run: |
          bash -n scripts/setup_desktop.sh

      - name: Success
        run: echo "✅ Cloud GPU PC project is valid!"
