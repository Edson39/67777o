name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Instalar e Configurar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando AnyDesk..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --silent" -Wait
        
        Write-Host "Configurando Acesso Nao Supervisionado..."
        cmd.exe /c "echo SuaSenhaForte123! | `"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --set-password"
        
        Restart-Service -Name "AnyDesk" -Force
        Start-Sleep -Seconds 10

    - name: Instalar Sunshine (Servidor Moonlight)
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'
        Write-Host "Instalando Sunshine..."
        winget install --id LizardByte.Sunshine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
        
        Write-Host "Liberando portas do Moonlight/Sunshine no Firewall..."
        New-NetFirewallRule -DisplayName "Sunshine-TCP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010
        New-NetFirewallRule -DisplayName "Sunshine-UDP" -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010

        Write-Host "Iniciando o serviço do Sunshine..."
        Start-Process -FilePath "C:\Program Files\LizardByte\Sunshine\sunshine.exe" -WindowStyle Hidden
        exit 0

    - name: Instalar Jogos e Aplicativos (Discord, Steam, Roblox, FiveM)
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'

        Write-Host "Instalando Discord..."
        winget install --id Discord.Discord --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Steam..."
        winget install --id Valve.Steam --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Roblox Player..."
        winget install --id Roblox.Roblox --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Bloxstrap..."
        winget install --id pizzaboxer.Bloxstrap --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando FiveM..."
        winget install --id CitizenFX.FiveM --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalações concluídas!"
        exit 0

    - name: Configurar Senha do Windows e RDP
      shell: powershell
      run: |
        $password = ConvertTo-SecureString "SuaSenhaForte123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Configurar Papel de Parede
      shell: powershell
      run: |
        $imgPath = (Get-Item ".\e54ff1cc376b23c96a3d27edaadbc1fc.jpg").FullName
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $imgPath
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10"
        Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value "0"
        
        Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class W { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
        [W]::SystemParametersInfo(0x0014, 0, $imgPath, 0x01 -bor 0x02)
        
        Write-Host "Papel de parede configurado com sucesso!"

    - name: Manter Runner Ativo
      shell: powershell
      run: |
        Write-Host "Tudo pronto! Sunshine ativo e portas liberadas."
        Start-Sleep -Seconds 21600
