Name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Instalar e Iniciar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando o AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando o AnyDesk..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"$env:ProgramFiles\AnyDesk`" --silent --create-desktop-icon" -Wait
        
        Write-Host "Definindo senha de acesso nao supervisionado..."
        "SuaSenhaForte123!" | & "$env:ProgramFiles\AnyDesk\AnyDesk.exe" --set-password
        
        Write-Host "Iniciando o serviço do AnyDesk..."
        Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
        Start-Process -FilePath "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
        
        Start-Sleep -Seconds 5
        Write-Host "AnyDesk instalado e configurado com sucesso!"

    - name: Definir senha do Administrador e RDP
      shell: powershell
      run: |
        $password = ConvertTo-SecureString "SuaSenhaForte123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Mostrar IP do Tailscale
      shell: powershell
      run: |
        tailscale ip -4

    - name: Testar Windows
      shell: powershell
      run: |
        Write-Host "Windows runner pronto com AnyDesk e Tailscale."
        Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture

    - name: Manter ligado
      shell: powershell
      run: |
        Write-Host "Runner mantido ativo."
        Start-Sleep -Seconds 21600
