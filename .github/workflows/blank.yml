name: Windows Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Definir senha do Administrador
      shell: powershell
      run: |
        # Define a senha para o usuário administrador padrão
        $password = ConvertTo-SecureString "SuaSenhaForte123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password
        # Habilita o RDP (Área de Trabalho Remota)
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Mostrar IP do Tailscale
      shell: powershell
      run: |
        tailscale ip -4

    - name: Testar Windows
      shell: powershell
      run: |
        Write-Host "Windows runner conectado ao Tailscale."
        Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture

    - name: Manter ligado
      shell: powershell
      run: |
        Write-Host "Runner mantido ativo."
        Start-Sleep -Seconds 21600
