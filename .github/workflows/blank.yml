name: Windows AnyDesk & Tailscale Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Conectar ao Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Instalar e Configurar AnyDesk
      shell: powershell
      run: |
        Write-Host "Baixando AnyDesk..."
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
        
        Write-Host "Instalando AnyDesk..."
        Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --silent" -Wait
        
        Write-Host "Configurando Acesso Nao Supervisionado..."
        cmd.exe /c "echo SuaSenhaForte123! | `"C:\Program Files (x86)\AnyDesk\AnyDesk.exe`" --set-password"
        
        Restart-Service -Name "AnyDesk" -Force
        Start-Sleep -Seconds 10

    - name: Instalar Ferramentas de Compactação (7-Zip)
      shell: powershell
      run: |
        winget install --id 7zip.7zip --silent --accept-source-agreements --accept-package-agreements

    - name: Instalar Jogos e Aplicativos (Discord, Steam, Roblox, FiveM)
      shell: powershell
      run: |
        $ErrorActionPreference = 'SilentlyContinue'

        Write-Host "Instalando Discord..."
        winget install --id Discord.Discord --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Steam..."
        winget install --id Valve.Steam --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Roblox Player..."
        winget install --id Roblox.Roblox --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando Bloxstrap..."
        winget install --id pizzaboxer.Bloxstrap --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalando FiveM..."
        winget install --id CitizenFX.FiveM --silent --accept-source-agreements --accept-package-agreements

        Write-Host "Instalações de apps concluídas!"

    - name: Baixar e Extrair GTA V Lite
      shell: powershell
      run: |
        # Substitua a URL abaixo pelo link direto do seu arquivo (.zip, .rar ou .7z)
        $gtaUrl = "HTTPS://SEU-LINK-DIRETO-AQUI.COM/GTA_V.zip"
        $outputFile = "$env:TEMP\gta_lite.zip"
        $extractPath = "C:\Games\GTA_V"

        Write-Host "Baixando arquivos do GTA V..."
        Invoke-WebRequest -Uri $gtaUrl -OutFile $outputFile

        Write-Host "Extraindo arquivos para $extractPath..."
        # Se for .zip nativo:
        Expand-Archive -Path $outputFile -DestinationPath $extractPath -Force

        # Caso o arquivo seja .rar ou .7z, use a linha do 7-Zip abaixo (remova o # da linha seguinte):
        # & "C:\Program Files\7-Zip\7z.exe" x $outputFile "-o$extractPath" -y

        Remove-Item $outputFile
        Write-Host "GTA V extraído com sucesso!"

    - name: Configurar Senha do Windows e RDP
      shell: powershell
      run: |
        $password = ConvertTo-SecureString "SuaSenhaForte123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Manter Runner Ativo
      shell: powershell
      run: |
        Write-Host "Tudo pronto! Conecte via AnyDesk com a senha: SuaSenhaForte123!"
        Start-Sleep -Seconds 21600
