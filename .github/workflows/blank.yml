
name: Windows RDP + Tailscale + AnyDesk

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Runner request created by the private dashboard.
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Criar administrador Edson
        shell: powershell
        run: |
          $username = "Edson"
          $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+'

          $password = -join (1..32 | ForEach-Object {
            $alphabet[[System.Security.Cryptography.RandomNumberGenerator]::GetInt32($alphabet.Length)]
          })

          Write-Output "::add-mask::$password"

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          "RUNNER_USERNAME=$username" | Out-File $env:GITHUB_ENV -Append
          "RUNNER_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires
          } else {
            Set-LocalUser -Name $username -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          Write-Host "Administrador configurado."

      - name: Ativar RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP configurado."

      - name: Instalar AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          Start-Process -FilePath $installer -ArgumentList "--install `"$env:ProgramFiles\AnyDesk`" --silent" -Wait

          $exe = "$env:ProgramFiles\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $exe)) {
            throw "AnyDesk não foi instalado corretamente."
          }

          Start-Service -Name AnyDesk -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $id = & $exe --get-id

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Não foi possível obter o ID do AnyDesk."
          }

          Write-Output "::add-mask::$id"
          "ANYDESK_ID=$id" | Out-File $env:GITHUB_ENV -Append

          Write-Host "AnyDesk instalado e ID obtido."

      - name: Enviar credenciais ao painel privado
        shell: powershell
        env:
          RUNNER_REQUEST_ID: ${{ inputs.request_id }}
          RUNNER_CALLBACK_URL: ${{ secrets.RUNNER_CALLBACK_URL }}
          RUNNER_CALLBACK_TOKEN: ${{ secrets.RUNNER_CALLBACK_TOKEN }}
        run: |
          $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

          if ($ip -notmatch '^\d{1,3}(?:\.\d{1,3}){3}$') {
            throw "IP do Tailscale inválido."
          }

          if (!$env:RUNNER_PASSWORD -or !$env:RUNNER_USERNAME) {
            throw "Credenciais indisponíveis."
          }

          if (!$env:RUNNER_CALLBACK_URL -or !$env:RUNNER_CALLBACK_TOKEN -or !$env:RUNNER_REQUEST_ID) {
            throw "Configuração do painel ausente."
          }

          Write-Output "::add-mask::$env:RUNNER_PASSWORD"
          Write-Output "::add-mask::$env:RUNNER_CALLBACK_TOKEN"

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $payload = @{
            requestId = $env:RUNNER_REQUEST_ID
            status = "ready"
            tailscaleIp = $ip
            username = ".\$env:RUNNER_USERNAME"
            password = $env:RUNNER_PASSWORD
            anydeskId = $env:ANYDESK_ID
            runId = "$env:GITHUB_RUN_ID"
            runUrl = $runUrl
            error = $null
          } | ConvertTo-Json -Compress

          Invoke-RestMethod `
            -Uri $env:RUNNER_CALLBACK_URL `
            -Method Post `
            -Headers @{
              Authorization = "Bearer $env:RUNNER_CALLBACK_TOKEN"
            } `
            -ContentType "application/json" `
            -Body $payload `
            -TimeoutSec 30

          Write-Host "Dados enviados ao painel."

      - name: Manter computador ativo
        shell: powershell
        run: |
          Write-Host "Runner ativo por até 6 horas."
          Start-Sleep -Seconds 21600
