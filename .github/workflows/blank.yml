name: Cloud PC RDP

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duração máxima da sessão (1 a 360 minutos)"
        required: true
        default: "1"
        type: string
      session_id:
        description: "ID externo da sessão"
        required: true
        type: string

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Validate session duration
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"
          if ($minutes -lt 1 -or $minutes -gt 360) { throw "duration_minutes must be between 1 and 360" }
          "SESSION_ID=${{ inputs.session_id }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Remote Desktop with NLA
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 2 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 profile=any
          Restart-Service -Name TermService -Force

      - name: Create restricted RDP user
        shell: pwsh
        run: |
          $chars = ([char[]](65..90) + [char[]](97..122) + [char[]](48..57) + [char[]](33..47))
          $password = -join (1..24 | ForEach-Object { $chars | Get-Random })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) { Set-LocalUser -Name "RDP" -Password $securePassword } else { New-LocalUser -Name "RDP" -Password $securePassword -AccountNeverExpires }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          "::add-mask::$password"
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait
          Remove-Item $installer -Force

      - name: Join private Tailscale network
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { throw "TAILSCALE_AUTH_KEY is required" }
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname="gh-cloud-pc-$env:GITHUB_RUN_ID" --accept-routes
          $tsIP = $null
          for ($i = 0; $i -lt 20 -and -not $tsIP; $i++) { $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim(); if (-not $tsIP) { Start-Sleep -Seconds 3 } }
          if (-not $tsIP) { throw "Tailscale IP was not assigned" }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify private RDP access
        shell: pwsh
        run: |
          $result = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $result.TcpTestSucceeded) { throw "RDP is not reachable over Tailscale" }
          Write-Host "Session $env:SESSION_ID ready on private Tailscale network"
          Write-Host "Address: $env:TAILSCALE_IP | Username: RDP"

      - name: Keep session active
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.duration_minutes }}"
          Write-Host "Cloud PC active for $minutes minutes"
          Start-Sleep -Seconds ($minutes * 60)

      - name: Remove RDP access
        if: always()
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
