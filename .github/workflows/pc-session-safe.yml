name: AI PC Session (safe)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowed operation"
        required: true
        type: choice
        options:
          - inference
          - matrix_multiplication
          - embedding
      prompt:
        description: "Short task description"
        required: true
        type: string
      task_id:
        description: "External task identifier"
        required: true
        type: string
      session_hours:
        description: "Horas que a sessao deve ficar ativa"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  pc-session:
    runs-on: windows-latest
    timeout-minutes: 360 # Limite maximo do GitHub Actions é de 6 horas (360 min)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Join private Tailscale network
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        if: ${{ env.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      - name: Create controlled session snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview, results | Out-Null
          
          $metadata = [ordered]@{
            task_id    = "${{ inputs.task_id }}"
            operation  = "${{ inputs.operation }}"
            prompt     = "${{ inputs.prompt }}"
            runner     = $env:RUNNER_NAME
            os         = $env:RUNNER_OS
            created_at = (Get-Date).ToUniversalTime().ToString("o")
            note       = "GitHub-hosted runner; destroyed after the workflow."
          }
          $metadata | ConvertTo-Json | Set-Content preview/metadata.json -Encoding UTF8

      - name: Keep session alive
        shell: pwsh
        run: |
          $hours = [int]"${{ inputs.session_hours }}"
          $seconds = $hours * 3600
          Write-Host "Manter a sessao ativa por $hours hora(s) ($seconds segundos)..."
          Start-Sleep -Seconds $seconds
