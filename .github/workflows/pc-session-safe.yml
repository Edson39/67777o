name: AI PC Session (safe)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowed operation"
        required: true
        type: choice
        options:
          - inference
          - matrix_multiplication
          - embedding
      prompt:
        description: "Short task description"
        required: true
        type: string
      task_id:
        description: "External task identifier"
        required: true
        type: string
      download_url:
        description: "Optional approved HTTPS download URL"
        required: false
        type: string

permissions:
  contents: write

jobs:
  pc-session:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join private Tailscale network
        if: ${{ secrets.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      - name: Create controlled session snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview, results | Out-Null
          $metadata = [ordered]@{
            task_id = "${{ inputs.task_id }}"
            operation = "${{ inputs.operation }}"
            prompt = "${{ inputs.prompt }}"
            runner = $env:RUNNER_NAME
            os = $env:RUNNER_OS
            created_at = (Get-Date).ToUniversalTime().ToString("o")
            note = "GitHub-hosted runner; destroyed after the workflow."
          }
          $metadata | ConvertTo-Json | Set-Content preview/metadata.json -Encoding UTF8
          @"
          <!doctype html><html><head><meta charset="utf-8"><title>AI PC session</title><style>body{font-family:Segoe UI;background:#07111f;color:#dffaff;padding:32px}main{max-width:720px;margin:auto;border:1px solid #164e63;border-radius:16px;padding:24px}code{color:#67e8f9}</style></head><body><main><h1>AI PC session snapshot</h1><p>Runner: <code>$env:RUNNER_NAME</code></p><p>Operation: <code>${{ inputs.operation }}</code></p><p>This is an artifact snapshot. The hosted runner expires after the job.</p></main></body></html>
          "@ | Set-Content preview/index.html -Encoding UTF8

      - name: Download approved HTTPS file
        if: ${{ inputs.download_url != '' }}
        shell: pwsh
        run: |
          $url = "${{ inputs.download_url }}"
          $uri = [Uri]$url
          if ($uri.Scheme -ne "https") { throw "Only HTTPS downloads are allowed." }
          if ($uri.UserInfo) { throw "Credential-bearing URLs are not allowed." }
          $name = [IO.Path]::GetFileName($uri.AbsolutePath)
          if ([string]::IsNullOrWhiteSpace($name)) { $name = "download.bin" }
          if ($name -match '\.(exe|msi|bat|cmd|ps1|psm1|vbs|js|jar|scr|com)$') { throw "Executable or script downloads are blocked." }
          $target = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri $url -OutFile $target -MaximumRedirection 3
          if ((Get-Item $target).Length -gt 25MB) { Remove-Item $target -Force; throw "Download exceeds the 25 MiB limit." }
          @{ name = $name; size = (Get-Item $target).Length; source = $url; downloaded_at = (Get-Date).ToUniversalTime().ToString("o") } | ConvertTo-Json | Set-Content results/download.json -Encoding UTF8

      - name: Write structured result
        shell: pwsh
        run: |
          @{ ok = $true; task_id = "${{ inputs.task_id }}"; operation = "${{ inputs.operation }}"; completed_at = (Get-Date).ToUniversalTime().ToString("o") } | ConvertTo-Json | Set-Content "results/${{ inputs.task_id }}.json" -Encoding UTF8

      - name: Publish snapshot and result
        uses: actions/upload-artifact@v4
        with:
          name: ai-pc-preview-${{ inputs.task_id }}
          path: |
            preview
            results
