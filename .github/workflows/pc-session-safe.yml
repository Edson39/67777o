name: AI PC Session (safe)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowed operation"
        required: true
        type: choice
        options:
          - inference
          - matrix_multiplication
          - embedding
      prompt:
        description: "Short task description"
        required: true
        type: string
      task_id:
        description: "External task identifier"
        required: true
        type: string
      download_url:
        description: "Optional approved HTTPS download URL"
        required: false
        type: string

permissions:
  contents: write

jobs:
  pc-session:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Join private Tailscale network
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        if: ${{ env.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      - name: Create controlled session snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview, results | Out-Null
          
          $metadata = [ordered]@{
            task_id    = "${{ inputs.task_id }}"
            operation  = "${{ inputs.operation }}"
            prompt     = "${{ inputs.prompt }}"
            runner     = $env:RUNNER_NAME
            os         = $env:RUNNER_OS
            created_at = (Get-Date).ToUniversalTime().ToString("o")
            note       = "GitHub-hosted runner; destroyed after the workflow."
          }
          $metadata | ConvertTo-Json | Set-Content preview/metadata.json -Encoding UTF8
          
          @"
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>AI PC session</title>
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #07111f; color: #dffaff; padding: 32px; }
              main { max-width: 720px; margin: auto; border: 1px solid #164e63; border-radius: 16px; padding: 24px; background: #0c1a2e; }
              code { color: #67e8f9; background: #162a45; padding: 2px 6px; border-radius: 4px; }
              h1 { color: #38bdf8; }
            </style>
          </head>
          <body>
            <main>
              <h1>AI PC session snapshot</h1>
              <p>Task ID: <code>${{ inputs.task_id }}</code></p>
              <p>Runner: <code>$env:RUNNER_NAME</code></p>
              <p>Operation: <code>${{ inputs.operation }}</code></p>
              <p>Prompt: <code>${{ inputs.prompt }}</code></p>
              <hr style="border-color: #164e63; margin: 20px 0;">
              <p>This is an artifact snapshot. The hosted runner expires after the job.</p>
            </main>
          </body>
          </html>
          "@ | Set-Content preview/index.html -Encoding UTF8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-session-snapshot-${{ inputs.task_id }}
          path: |
            preview/
            results/
